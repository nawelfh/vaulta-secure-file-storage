openapi: 3.1.0
info:
  title: Vaulta API
  version: 1.0.0
  description: Secure file metadata, multipart upload authorization, and sharing API.
servers:
  - url: http://localhost:4000
tags:
  - name: Authentication
  - name: Files
  - name: Storage
  - name: Public
paths:
  /api/auth/register:
    post:
      tags: [Authentication]
      summary: Create an account and authenticated session
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Registration' }
      responses:
        '201':
          description: Account created
          headers:
            Set-Cookie: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/auth/login:
    post:
      tags: [Authentication]
      summary: Create an authenticated session
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Credentials' }
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/auth/me:
    get:
      tags: [Authentication]
      summary: Read the current session user
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/auth/logout:
    post:
      tags: [Authentication]
      summary: Revoke the current session
      security: [{ sessionCookie: [], csrfHeader: [] }]
      responses:
        '204': { description: Session revoked }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/files:
    get:
      tags: [Files]
      summary: List the current user's files
      security: [{ sessionCookie: [] }]
      parameters:
        - in: query
          name: cursor
          schema: { type: string, format: uuid }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - in: query
          name: page
          description: Enables numbered-page mode. The professional dashboard uses a limit of 5.
          schema: { type: integer, minimum: 1 }
        - in: query
          name: search
          description: Case-insensitive literal filename search, scoped to the authenticated owner and READY files.
          schema: { type: string, maxLength: 100 }
        - in: query
          name: sort
          schema: { type: string, enum: [newest, oldest, name-asc, name-desc, size-asc, size-desc, deleted-newest, deleted-oldest] }
        - in: query
          name: visibility
          schema: { type: string, enum: [PUBLIC, PRIVATE] }
        - in: query
          name: view
          description: Select active files, newest-first recent files, active favorites, or Trash.
          schema: { type: string, enum: [active, recent, favorites, trash], default: active }
      responses:
        '200':
          description: A cursor page for legacy callers, or a numbered page when page/search/sort/visibility is supplied.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/CursorFilePage'
                  - $ref: '#/components/schemas/NumberedFilePage'
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/files/uploads:
    post:
      tags: [Files]
      summary: Initialize a private multipart upload
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [originalName, mimeType, sizeBytes]
              properties:
                originalName: { type: string, maxLength: 255 }
                mimeType:
                  type: string
                  enum:
                    - application/pdf
                    - image/png
                    - image/jpeg
                    - image/gif
                    - image/webp
                    - video/mp4
                    - video/webm
                    - video/quicktime
                    - text/plain
                    - application/zip
                sizeBytes: { type: integer, minimum: 1, maximum: 262144000 }
      responses:
        '201':
          description: Upload initialized
          content:
            application/json:
              schema:
                type: object
                required: [file, partSizeBytes, partCount]
                properties:
                  file: { $ref: '#/components/schemas/File' }
                  partSizeBytes: { type: integer }
                  partCount: { type: integer }
        '413': { $ref: '#/components/responses/ValidationError' }
        '415': { $ref: '#/components/responses/ValidationError' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/files/{fileId}/parts:
    post:
      tags: [Files]
      summary: Create short-lived upload URLs for selected parts
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - $ref: '#/components/parameters/FileId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [partNumbers]
              properties:
                partNumbers:
                  type: array
                  minItems: 1
                  maxItems: 1000
                  uniqueItems: true
                  items: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Signed parts
          content:
            application/json:
              schema:
                type: object
                properties:
                  parts:
                    type: array
                    items:
                      type: object
                      required: [partNumber, url]
                      properties:
                        partNumber: { type: integer }
                        url: { type: string, format: uri }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/files/{fileId}/complete:
    post:
      tags: [Files]
      summary: Assemble, validate, and publish the upload
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - $ref: '#/components/parameters/FileId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [parts]
              properties:
                parts:
                  type: array
                  minItems: 1
                  maxItems: 1000
                  items:
                    type: object
                    additionalProperties: false
                    required: [partNumber, etag]
                    properties:
                      partNumber: { type: integer, minimum: 1 }
                      etag: { type: string, maxLength: 128 }
      responses:
        '200':
          description: Completed file
          content:
            application/json:
              schema:
                type: object
                properties:
                  file: { $ref: '#/components/schemas/File' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/files/{fileId}:
    patch:
      tags: [Files]
      summary: Change file visibility
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - $ref: '#/components/parameters/FileId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [visibility]
              properties:
                visibility: { type: string, enum: [PRIVATE, PUBLIC] }
      responses:
        '200':
          description: Updated file
          content:
            application/json:
              schema:
                type: object
                properties:
                  file: { $ref: '#/components/schemas/File' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Files]
      summary: Abort an unfinished upload or permanently delete a trashed file
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - $ref: '#/components/parameters/FileId'
      responses:
        '204': { description: Upload aborted or trashed file permanently deleted }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/files/{fileId}/favorite:
    patch:
      tags: [Files]
      summary: Set persistent favorite state for an active file
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - $ref: '#/components/parameters/FileId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [favorite]
              properties:
                favorite: { type: boolean }
      responses:
        '200':
          description: Favorite state updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  file: { $ref: '#/components/schemas/File' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/files/{fileId}/trash:
    post:
      tags: [Files]
      summary: Move an active READY file to Trash without deleting its object
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - $ref: '#/components/parameters/FileId'
      responses:
        '200':
          description: File moved to Trash
          content:
            application/json:
              schema:
                type: object
                properties:
                  file: { $ref: '#/components/schemas/File' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/files/{fileId}/restore:
    post:
      tags: [Files]
      summary: Restore a trashed READY file with its visibility and favorite state intact
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - $ref: '#/components/parameters/FileId'
      responses:
        '200':
          description: File restored
          content:
            application/json:
              schema:
                type: object
                properties:
                  file: { $ref: '#/components/schemas/File' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/files/{fileId}/download:
    get:
      tags: [Files]
      summary: Create a short-lived owner download URL
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/FileId'
      responses:
        '200':
          description: Download authorization
          content:
            application/json:
              schema:
                type: object
                required: [url, expiresIn]
                properties:
                  url: { type: string, format: uri }
                  expiresIn: { type: integer, example: 300 }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/storage/stats:
    get:
      tags: [Storage]
      summary: Read the current owner's authoritative storage statistics
      description: >-
        Counts active non-trashed READY files, while usedBytes sums all READY stored objects including
        Trash because moving a file does not delete its object. UPLOADING and REJECTED records are excluded.
        Byte fields use binary bytes. The
        assessment-wide 1 GiB quota is reporting-only and is not an atomic upload reservation.
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: READY-file storage statistics
          content:
            application/json:
              schema:
                type: object
                required: [stats]
                properties:
                  stats: { $ref: '#/components/schemas/StorageStats' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/public/{shareToken}:
    get:
      tags: [Public]
      summary: Read metadata for an available public file
      parameters:
        - in: path
          name: shareToken
          required: true
          schema: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' }
      responses:
        '200':
          description: Public file metadata
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicFileMetadata' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/public/{shareToken}/download:
    get:
      tags: [Public]
      summary: Create a short-lived signed download URL for an available public file
      parameters:
        - in: path
          name: shareToken
          required: true
          schema: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' }
      responses:
        '200':
          description: Authorized signed download
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [url, expiresIn]
                properties:
                  url: { type: string, format: uri }
                  expiresIn: { type: integer, example: 300 }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: secure_store_session
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
  parameters:
    FileId:
      in: path
      name: fileId
      required: true
      schema: { type: string, format: uuid }
  schemas:
    Credentials:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 12, maxLength: 128 }
    Registration:
      type: object
      additionalProperties: false
      required: [name, email, password]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 12, maxLength: 128 }
    User:
      type: object
      required: [id, name, email, createdAt]
      properties:
        id: { type: string, format: uuid }
        name:
          type: [string, 'null']
          maxLength: 100
          description: Null only for accounts created before names were collected.
        email: { type: string, format: email }
        createdAt: { type: string, format: date-time }
    AuthResponse:
      type: object
      required: [user]
      properties:
        user: { $ref: '#/components/schemas/User' }
    File:
      type: object
      required: [id, originalName, mimeType, sizeBytes, status, visibility, favorite, trashedAt, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        originalName: { type: string }
        mimeType: { type: string }
        sizeBytes: { type: integer }
        status: { type: string, enum: [UPLOADING, READY, REJECTED] }
        visibility: { type: string, enum: [PRIVATE, PUBLIC] }
        rejectionReason: { type: [string, 'null'] }
        shareUrl: { type: [string, 'null'], format: uri }
        favorite: { type: boolean }
        trashedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PublicFileMetadata:
      type: object
      additionalProperties: false
      required: [originalName, mimeType, sizeBytes, downloadExpiresIn]
      properties:
        originalName: { type: string }
        mimeType: { type: string }
        sizeBytes: { type: integer }
        downloadExpiresIn: { type: integer, example: 300 }
    CursorFilePage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/File' }
        nextCursor: { type: [string, 'null'], format: uuid }
    NumberedFilePage:
      type: object
      required: [files, pagination]
      properties:
        files:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/File' }
        pagination:
          type: object
          required: [page, limit, total, totalPages, hasPrevious, hasNext]
          properties:
            page: { type: integer, minimum: 1 }
            limit: { type: integer, minimum: 1, maximum: 50 }
            total: { type: integer, minimum: 0 }
            totalPages: { type: integer, minimum: 0 }
            hasPrevious: { type: boolean }
            hasNext: { type: boolean }
    StorageStats:
      type: object
      additionalProperties: false
      required:
        - totalFiles
        - publicFiles
        - privateFiles
        - usedBytes
        - quotaBytes
        - remainingBytes
        - percentageUsed
      properties:
        totalFiles:
          type: integer
          minimum: 0
          description: Active non-trashed READY files owned by the authenticated user.
        publicFiles:
          type: integer
          minimum: 0
          description: Active non-trashed READY files whose visibility is PUBLIC.
        privateFiles:
          type: integer
          minimum: 0
          description: Active non-trashed READY files whose visibility is PRIVATE.
        usedBytes:
          type: integer
          minimum: 0
          description: Sum of size_bytes for all owner READY objects including Trash, in bytes.
        quotaBytes:
          type: integer
          const: 1073741824
          description: Assessment-wide reporting quota in bytes (1 GiB).
        remainingBytes:
          type: integer
          minimum: 0
          description: quotaBytes minus usedBytes, clamped to zero.
        percentageUsed:
          type: number
          minimum: 0
          maximum: 100
          description: Usage percentage rounded to two decimal places and clamped to 100.
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code: { type: string }
            message: { type: string }
            requestId: { type: string }
            details: {}
  responses:
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: CSRF token missing or invalid
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource not found or not owned
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: State conflict
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: Too many public file requests
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
