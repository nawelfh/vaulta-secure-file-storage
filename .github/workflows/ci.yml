name: quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: secure_store
          POSTGRES_USER: secure_store
          POSTGRES_PASSWORD: secure_store
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U secure_store -d secure_store"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://secure_store:secure_store@localhost:5432/secure_store
      S3_REGION: us-east-1
      S3_BUCKET: secure-files-test
      S3_ACCESS_KEY_ID: test
      S3_SECRET_ACCESS_KEY: test-secret
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run lint
      - run: npm test
      - run: npm run build
