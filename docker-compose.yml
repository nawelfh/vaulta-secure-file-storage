services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: secure_store
      POSTGRES_USER: secure_store
      POSTGRES_PASSWORD: secure_store
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secure_store -d secure_store"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:5173
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  create-bucket:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    depends_on:
      - minio
    volumes:
      - ./infra/minio-cors.xml:/config/cors.xml:ro
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minio minio123; do sleep 1; done;
      mc mb --ignore-existing local/secure-files;
      mc anonymous set none local/secure-files;
      mc cors set local/secure-files /config/cors.xml;
      exit 0;"

volumes:
  postgres-data:
  minio-data:
